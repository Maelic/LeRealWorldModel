dataset:
  _target_: lewm.data.lerobot_adapter.LeRobotWMDataset
  repo_id: maelicneau/stack_cubes
  root: leWorldRobot/datasets/stack_cubes
  image_key: observation.images.up
  image_key2: null          # top camera only — no cam_fuser created
  proprio_key: observation.state
  action_key: action
  state_key: null
  frameskip: 5
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  return_uint8: true
  keys_to_load:
    - pixels
    - action
    - proprio

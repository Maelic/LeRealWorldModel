# Stage 2: GC-IDM training config — top camera only
# Use with lewm_so100_topcam Stage 1 checkpoints.
# Usage: python train_gc_idm.py --config-name gc_idm_topcam world_model_path=<path>

world_model_path: ???

seed: 3072
steps: 50000
batch_size: 256
max_horizon: 50

data:
  dataset:
    repo_id: maelicneau/stack_cubes
    root: leWorldRobot/datasets/stack_cubes
    image_key: observation.images.up
    image_key2: null
    image_keys:
      - observation.images.up
    frameskip: 5

# World model architecture — must match Stage 1 training
wm:
  encoder_scale: tiny
  patch_size: 14
  img_size: 224
  embed_dim: 192
  history_size: 3
  action_dim: 6
  frameskip: 5
  predictor:
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0

gc_idm:
  hidden_dim: 512
  horizon_dim: 64

optimizer:
  lr: 1e-4
  weight_decay: 1e-4
